services:
  - type: web
    name: pattern-studio
    runtime: docker
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: DEMO_MODE
        value: "0"
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pattern-studio-db
          property: connectionString
databases:
  - name: pattern-studio-db
    plan: free
    databaseName: patternstudio
    user: patternstudio
